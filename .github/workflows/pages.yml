name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build site
        run: npx eleventy
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Notify IndexNow
        if: success()
        run: |
          sleep 30
          # IndexNow key is intentionally public (hosted at site root per protocol);
          # read it from the key file in src/ rather than hardcoding.
          KEYFILE=$(ls src/ | grep -E '^[0-9a-f]{32}\.txt$' | head -1)
          KEY="${KEYFILE%.txt}"
          python3 - "$KEY" << 'PYEOF'
          import json, urllib.request, re, sys
          key = sys.argv[1]
          xml = urllib.request.urlopen('https://randypellegrini.com/sitemap.xml').read().decode()
          urls = re.findall(r'<loc>([^<]+)</loc>', xml)
          payload = {'host': 'randypellegrini.com', 'key': key, 'keyLocation': f'https://randypellegrini.com/{key}.txt', 'urlList': urls}
          req = urllib.request.Request('https://api.indexnow.org/indexnow', data=json.dumps(payload).encode(), headers={'Content-Type': 'application/json; charset=utf-8'})
          try:
              print('IndexNow:', urllib.request.urlopen(req).status)
          except Exception as e:
              print('IndexNow ping failed (non-fatal):', e)
          PYEOF
